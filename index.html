<!DOCTYPE html>
<html lang="en" data-theme="crimson">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PesterGDPS demonlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="brand-icon">
      <path d="M12 3c-4.4 0-8 3-8 7.5 0 3 1.6 4.7 2.4 6.5.4.9.6 2 .6 3h10c0-1 .2-2.1.6-3 .8-1.8 2.4-3.5 2.4-6.5C20 6 16.4 3 12 3Z"/>
      <circle cx="9" cy="11" r="1.4" fill="currentColor" stroke="none"/>
      <circle cx="15" cy="11" r="1.4" fill="currentColor" stroke="none"/>
      <path d="M9 15c1 .8 5 .8 6 0"/>
    </svg>
    <span>PesterGDPS</span>
  </div>
  <div class="icon-btn" id="profile-btn" aria-label="Open profile">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="12" cy="8" r="3.5"/>
      <path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/>
    </svg>
  </div>
</header>

<main>
  <div class="hero">
    <h1>Every rated demon, ranked.</h1>
    <p>The official PesterGDPS demon list, built from community difficulty votes.</p>
  </div>

  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="11" cy="11" r="7"/>
      <path d="m20 20-3.5-3.5"/>
    </svg>
    <input id="search" type="text" placeholder="Search by level name..." />
  </div>

  <div class="tabs">
    <div class="tab active" data-list="main">Main list</div>
    <div class="tab" data-list="legacy">Legacy list</div>
  </div>

  <div class="list" id="list"></div>
</main>

<nav class="bottom">
  <a class="active" href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    Home
  </a>
  <a href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 21h8M12 17v4M6 4h12v4a6 6 0 0 1-12 0V4Z"/><path d="M6 6H3v2a3 3 0 0 0 3 3M18 6h3v2a3 3 0 0 1-3 3"/></svg>
    Ranks
  </a>
  <a href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.4 8.4 0 0 1-8.6 8.5 8.7 8.7 0 0 1-4-1L3 20l1-4.5a8.4 8.4 0 0 1-1-4A8.4 8.4 0 0 1 11.6 3a8.5 8.5 0 0 1 9.4 8.5Z"/></svg>
    Chat
  </a>
  <a href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    Alerts
  </a>
</nav>

<div class="overlay" id="overlay"></div>
<div class="profile-panel" id="profile-panel">
  <div class="profile-panel-head">
    <span class="panel-title">Profile</span>
    <div class="icon-btn" id="profile-close" aria-label="Close profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </div>
  </div>

  <div class="profile-id">
    <div class="avatar">P</div>
    <div>
      <h3>Pester</h3>
      <p>PesterGDPS demonlist member</p>
    </div>
  </div>

  <div class="theme-section">
    <p class="section-label">Theme</p>
    <div class="theme-row">
      <button class="swatch" data-theme="crimson" aria-label="Crimson theme"><span class="dot dot-crimson"></span>Crimson</button>
      <button class="swatch" data-theme="violet" aria-label="Violet theme"><span class="dot dot-violet"></span>Violet</button>
      <button class="swatch" data-theme="amber" aria-label="Amber theme"><span class="dot dot-amber"></span>Amber</button>
      <button class="swatch" data-theme="light" aria-label="Light theme"><span class="dot dot-light"></span>Light</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
